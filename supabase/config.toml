# Configuração do projeto Supabase (uso local com `supabase start` e link com o projeto na nuvem).
project_id = "prodio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 900
enable_refresh_token_rotation = true
enable_signup = false
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false
enable_confirmations = true

# O hook grava tenant_id e papel no token para as policies de RLS.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[storage]
enabled = true
file_size_limit = "10MiB"
