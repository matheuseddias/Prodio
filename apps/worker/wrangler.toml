name = "prodio-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Segredos (wrangler secret put): SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_ANON_KEY, CREDENTIALS_KEY,
# BLING_CLIENT_ID, BLING_CLIENT_SECRET, TINY_CLIENT_ID, TINY_CLIENT_SECRET. Ver README.md.
# Segredo sobrevive a um deploy; variável de texto criada no painel, não. `wrangler deploy` substitui
# a lista de [vars] pela daqui, então o que for texto mora neste arquivo ou some na publicação seguinte.
# Service role só em cron, webhook e e-mail. Rotas acionadas por usuário (/nfe/xml, /connectors/*) usam
# a anon key + o JWT do próprio usuário, então RLS e assert_member valem.

# Não são segredo: endereço público do worker e a lista de sites que podem chamá-lo pelo navegador.
# Ficam aqui para a publicação ser reprodutível. Sem CORS_ORIGENS o worker só aceita localhost e a
# interface publicada falha no preflight; sem PUBLIC_URL o OAuth do Tiny e do Bling não fecha.
[vars]
PUBLIC_URL = "https://prodio-worker.matheus-ea1.workers.dev"
CORS_ORIGENS = "https://app.prodio.com.br,https://prodio-web.pages.dev,https://*.prodio-web.pages.dev,http://localhost:5173"

[triggers]
crons = [
  "*/5 * * * *",   # sync de pedidos e aplicação do outbox
  "0 3 * * *"      # auditor noturno de estoque no hub
]

# Workers Logs: guarda os logs do worker (inclusive os do cron) no painel da Cloudflare, em
# Workers & Pages > prodio-worker > Observability (ou Logs). Sem isto, erro do robô só aparecia para
# quem estivesse com `wrangler tail` aberto no minuto certo — foi assim que o cron passou um dia sem
# gravar nada sem ninguém ver o porquê. Vale no plano Free (200 mil eventos/dia, 3 dias de retenção)
# e no pago (20 milhões/mês incluídos, 7 dias). O robô gera uns poucos milhares de eventos por dia.
# Fonte: developers.cloudflare.com/workers/observability/logs/workers-logs/ (wrangler >= 3.78.6).
[observability]
enabled = true
head_sampling_rate = 1   # 1 = guarda 100% das execuções; é pouco volume, e é o erro raro que interessa

# E-mail de entrada (Email Routing): regra "xml@*.prodio.app" -> este worker (handler email). Ver README.md.
# Sem binding de envio: o worker só recebe.
